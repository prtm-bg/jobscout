<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JobScout{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            750: '#2d3748',
                            800: '#1f2937',
                            900: '#111827',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased flex h-screen overflow-hidden">
    
    <!-- Sidebar -->
    {% set active_page = active_page|default('dashboard') %}
    <aside class="fixed inset-y-0 left-0 w-64 bg-gray-800 border-r border-gray-700 z-50 flex flex-col transition-transform duration-300 transform -translate-x-full md:translate-x-0">
        <div class="flex items-center justify-center h-16 border-b border-gray-700">
            <span class="text-2xl font-bold text-indigo-400">💼 JobScout</span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="/" class="flex items-center px-4 py-3 rounded-lg transition-colors {% if active_page == 'dashboard' %}bg-indigo-600/20 text-indigo-400 font-medium border border-indigo-500/30{% else %}text-gray-400 hover:bg-gray-700 hover:text-gray-100{% endif %}">
                <span class="mr-3 text-lg">📊</span>
                Dashboard
            </a>
            <a href="/targets" class="flex items-center px-4 py-3 rounded-lg transition-colors {% if active_page == 'targets' %}bg-indigo-600/20 text-indigo-400 font-medium border border-indigo-500/30{% else %}text-gray-400 hover:bg-gray-700 hover:text-gray-100{% endif %}">
                <span class="mr-3 text-lg">🎯</span>
                Targets
            </a>
            <a href="/scheduler" class="flex items-center px-4 py-3 rounded-lg transition-colors {% if active_page == 'scheduler' %}bg-indigo-600/20 text-indigo-400 font-medium border border-indigo-500/30{% else %}text-gray-400 hover:bg-gray-700 hover:text-gray-100{% endif %}">
                <span class="mr-3 text-lg">⏱️</span>
                Scheduler
            </a>
            <a href="/settings" class="flex items-center px-4 py-3 rounded-lg transition-colors {% if active_page == 'settings' %}bg-indigo-600/20 text-indigo-400 font-medium border border-indigo-500/30{% else %}text-gray-400 hover:bg-gray-700 hover:text-gray-100{% endif %}">
                <span class="mr-3 text-lg">⚙️</span>
                Settings
            </a>
        </nav>
        <div class="p-4 border-t border-gray-700 text-xs text-gray-500 text-center">
            JobScout v1.0
        </div>
        <!-- Logout -->
        <div class="p-4 border-t border-gray-800">
            <form action="/logout" method="post">
                <button type="submit" class="flex items-center px-4 py-3 w-full text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition-colors group">
                    <svg class="w-5 h-5 mr-3 group-hover:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Logout
                </button>
            </form>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen md:ml-64 bg-gray-900 overflow-y-auto w-full">
        <header class="md:hidden flex items-center justify-between p-4 bg-gray-800 border-b border-gray-700">
            <span class="text-xl font-bold text-indigo-400">💼 JobScout</span>
            <button class="text-gray-400 hover:text-white focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </header>
        <div class="p-4 md:p-8 flex-1">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 max-w-sm w-full pointer-events-none"></div>

    <!-- Custom JS -->
    <script src="/static/js/app.js"></script>
</body>
</html>
