{% if jobs %}
    {% for job in jobs %}
        {% include 'partials/job_row.html' %}
    {% endfor %}
{% else %}
    <tr>
        <td colspan="7" class="px-6 py-12 text-center text-gray-500">
            <div class="flex flex-col items-center justify-center">
                <svg class="w-12 h-12 mb-3 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <p class="text-lg">No jobs found</p>
                <p class="text-sm mt-1">Try adjusting your filters or running the scraper.</p>
            </div>
        </td>
    </tr>
{% endif %}
